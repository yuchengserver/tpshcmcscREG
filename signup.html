<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSSC13TH - 活動報名專區</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .question-img {
      max-width: 100%;
      max-height: 250px;
      border-radius: 6px;
      margin-top: 8px;
      border: 1px solid #d0d7de;
    }
  </style>
</head>
<body>
  <!-- 頂部導覽列 -->
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="tpshcmcsc.png" alt="TSSC Logo" class="nav-logo">
      <span>TSSC13TH 活動報名專區</span>
    </a>
    <div class="nav-menu">
      <a href="index.html" class="nav-btn active">首頁與通知</a>
      <a href="resend.html" class="nav-btn">🔍 查詢我的報名</a>
    </div>
  </header>

  <div class="container signup-container">
    <p style="margin-bottom: 15px;"><a href="index.html" class="back-link">← 返回活動列表</a></p>

    <div class="event-detail-box">
      <h2 id="targetEventTitle" class="detail-title">載入活動名稱中...</h2>
      <p id="targetEventTime" class="detail-time">⏰ 時間：載入中...</p>
      <p id="targetEventDesc" class="detail-desc"></p>
    </div>

    <form id="signupForm" style="margin-top: 25px;">
      <div class="form-group" style="display:none;">
        <label for="eventId">選擇活動 *</label>
        <select id="eventId" class="form-control" required>
          <option value="">載入中...</option>
        </select>
      </div>

      <!-- 動態題目渲染容器 -->
      <div id="dynamicQuestionsContainer">
        <p style="color: #57606a;">正在載入報名表單題目...</p>
      </div>

      <div class="form-group" style="margin-top: 25px;">
        <label for="email">學校官方電子信箱 (@tshcmc.edu.vn) *</label>
        <div class="input-with-btn">
          <input type="email" id="email" class="form-control" required placeholder="1234567@tshcmc.edu.vn" pattern="^\d{7}@tshcmc\.edu\.vn$">
          <button type="button" id="sendCodeBtn" class="btn-verify" onclick="sendVerificationCode()">發送驗證碼</button>
        </div>
      </div>

      <div class="form-group">
        <label for="code">信箱驗證碼 (6 位數字) *</label>
        <input type="text" id="code" class="form-control" required placeholder="請輸入 6 位數驗證碼" maxlength="6">
        <small class="hint-text">請輸入寄送至您學校信箱中的 6 位數一次性驗證碼（有效期限 5 分鐘，每人每天最多發送 5 次）。</small>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit" style="margin-top: 20px;">確認並送出報名</button>
    </form>

    <div id="message" class="message" style="display:none;"></div>

    <div class="login-footer" style="margin-top: 35px; text-align: center;">
      胡志明市臺灣學校學生會 TSSC13TH © 2026 yucheng
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzw8vASm3Nm7eIpcQYQ_QBMK4m3j0d9Thcw8N8nWBsuUPJDCsioB_KLErcH1nIP2v0/exec";
    const TARGET_SHEET_ID = "18fxfF-BnNlDnhCH0NORbNeWXKSo1KHmljfPCkpvJTKo"; // 🔒 指定專用上鎖試算表 ID
    let countdownTimer = null;
    let currentEventData = null;

    function validateSchoolEmail(email) {
      const regex = /^\d{7}@tshcmc\.edu\.vn$/i;
      return regex.test(email);
    }

    function getNowGMT7() {
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      return new Date(utc + (3600000 * 7));
    }

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetEventId = urlParams.get('eventId');

      fetch(`${GAS_URL}?action=getEvents`)
        .then(res => res.json())
        .then(res => {
          const select = document.getElementById("eventId");
          select.innerHTML = '<option value="">-- 請選擇報名活動 --</option>';
          
          if (res.status === "success" && res.data && res.data.length > 0) {
            const now = getNowGMT7();

            res.data.forEach(item => {
              const startTime = new Date(item["開始時間"]);
              const endTime = new Date(item["結束時間"]);
              const isActive = (now >= startTime && now < endTime);
              
              if (isActive || item["活動ID"] === targetEventId) {
                const opt = document.createElement("option");
                opt.value = item["活動ID"];
                opt.textContent = `${item["活動名稱"]} (${item["活動ID"]})`;
                
                if (targetEventId && item["活動ID"] === targetEventId) {
                  opt.selected = true;
                  currentEventData = item;
                  document.getElementById("targetEventTitle").textContent = item["活動名稱"];
                  document.getElementById("targetEventDesc").textContent = item["說明"] || "";
                  document.getElementById("targetEventTime").textContent = `⏰ 開始時間：${new Date(item["開始時間"]).toLocaleString()} | ⌛ 截止時間：${new Date(item["結束時間"]).toLocaleString()}`;
                  
                  // 渲染動態表單題目
                  renderDynamicQuestions(item["題目JSON"]);
                }
                select.appendChild(opt);
              }
            });
          }
        });
    };

    function renderDynamicQuestions(jsonStr) {
      const container = document.getElementById("dynamicQuestionsContainer");
      container.innerHTML = "";

      try {
        const questions = JSON.parse(jsonStr || "[]");
        if (questions.length === 0) {
          container.innerHTML = "<p style='color: #cf222e;'>此活動尚未設定任何報名題目，請聯絡管理員。</p>";
          return;
        }

        questions.forEach((q, index) => {
          const div = document.createElement("div");
          div.className = "form-group question-card-item";
          div.setAttribute("data-label", q.label);
          div.setAttribute("data-type", q.type);
          div.setAttribute("data-min", q.minSelect || 0);
          div.setAttribute("data-max", q.maxSelect || 0);
          div.style.marginBottom = "25px";
          div.style.background = "#f6f8fa";
          div.style.padding = "15px";
          div.style.borderRadius = "8px";
          div.style.border = "1px solid #d0d7de";

          let limitHint = "";
          if (q.type === "checkbox" && (q.minSelect > 0 || q.maxSelect > 0)) {
            if (q.minSelect > 0 && q.maxSelect > 0) {
              if (q.minSelect === q.maxSelect) {
                limitHint = ` <small style="color: #0969da; font-weight: normal;">(須選 ${q.minSelect} 項)</small>`;
              } else {
                limitHint = ` <small style="color: #0969da; font-weight: normal;">(須選 ${q.minSelect} ~ ${q.maxSelect} 項)</small>`;
              }
            } else if (q.minSelect > 0) {
              limitHint = ` <small style="color: #0969da; font-weight: normal;">(至少選 ${q.minSelect} 項)</small>`;
            } else if (q.maxSelect > 0) {
              limitHint = ` <small style="color: #0969da; font-weight: normal;">(最多選 ${q.maxSelect} 項)</small>`;
            }
          }

          let labelHTML = `<label style="font-weight: 600; font-size: 15px;">${q.label} ${q.required ? '<span style="color:red;">*</span>' : ''}${limitHint}</label>`;
          let imgHTML = q.imageUrl ? `<div style="margin-top: 8px;"><img src="${q.imageUrl}" class="question-img"></div>` : "";
          let inputHTML = "";

          if (q.type === "text") {
            inputHTML = `<input type="text" class="form-control dynamic-input" ${q.required ? 'required' : ''} placeholder="請輸入${q.label}">`;
          } else if (q.type === "textarea") {
            inputHTML = `<textarea class="form-control dynamic-input" rows="3" ${q.required ? 'required' : ''} placeholder="請輸入${q.label}"></textarea>`;
          } else if (q.type === "select") {
            let opts = `<option value="">-- 請選擇 --</option>`;
            let hasOther = false;
            (q.options || []).forEach(opt => {
              const optObj = typeof opt === 'string' ? { text: opt, isOther: false } : opt;
              if (optObj.isOther) {
                hasOther = true;
                opts += `<option value="other_option">其他...</option>`;
              } else {
                opts += `<option value="${optObj.text}">${optObj.text}</option>`;
              }
            });
            inputHTML = `<select class="form-control dynamic-select" ${q.required ? 'required' : ''} onchange="handleSelectOther(this)">${opts}</select>`;
            if (hasOther) {
              inputHTML += `<input type="text" class="form-control select-other-input" style="margin-top: 8px; display: none;" placeholder="請輸入其他內容">`;
            }
          } else if (q.type === "radio") {
            let opts = "";
            (q.options || []).forEach(opt => {
              const optObj = typeof opt === 'string' ? { text: opt, isOther: false } : opt;
              if (optObj.isOther) {
                opts += `
                  <div style="margin-top: 6px; display: flex; align-items: center; gap: 8px;">
                    <label style="font-weight: normal; display: flex; align-items: center; gap: 4px; margin: 0; cursor: pointer;">
                      <input type="radio" name="q_${index}" value="other" class="dynamic-radio" onchange="handleRadioOther(this)"> 其他：
                    </label>
                    <input type="text" class="form-control radio-other-input" disabled placeholder="請自行填寫" style="flex: 1; padding: 4px 8px; font-size: 13px;">
                  </div>
                `;
              } else {
                opts += `<div style="margin-top: 6px;"><label style="font-weight: normal; cursor: pointer;"><input type="radio" name="q_${index}" value="${optObj.text}" class="dynamic-radio" onchange="handleRadioOther(this)"> ${optObj.text}</label></div>`;
              }
            });
            inputHTML = opts;
          } else if (q.type === "checkbox") {
            let opts = "";
            (q.options || []).forEach(opt => {
              const optObj = typeof opt === 'string' ? { text: opt, isOther: false } : opt;
              if (optObj.isOther) {
                opts += `
                  <div style="margin-top: 6px; display: flex; align-items: center; gap: 8px;">
                    <label style="font-weight: normal; display: flex; align-items: center; gap: 4px; margin: 0; cursor: pointer;">
                      <input type="checkbox" value="other" class="dynamic-checkbox"> 其他：
                    </label>
                    <input type="text" class="form-control checkbox-other-input" disabled placeholder="請自行填寫" style="flex: 1; padding: 4px 8px; font-size: 13px;">
                  </div>
                `;
              } else {
                opts += `<div style="margin-top: 6px;"><label style="font-weight: normal; cursor: pointer;"><input type="checkbox" value="${optObj.text}" class="dynamic-checkbox"> ${optObj.text}</label></div>`;
              }
            });
            inputHTML = opts;
          }

          div.innerHTML = labelHTML + imgHTML + `<div style="margin-top: 10px;">${inputHTML}</div>`;
          container.appendChild(div);
        });

        // 為所有 checkbox 綁定即時監聽（用於「其他」輸入框啟用與連動）
        document.querySelectorAll(".dynamic-checkbox").forEach(cb => {
          cb.addEventListener("change", function() {
            const row = this.closest('div') || this.parentElement;
            const input = row.querySelector('.checkbox-other-input');
            if (input) {
              if (this.checked) {
                input.disabled = false;
                input.required = true;
              } else {
                input.disabled = true;
                input.value = "";
                input.required = false;
              }
            }
          });
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = "<p style='color:red;'>題目載入解析失敗。</p>";
      }
    }

    function handleSelectOther(selectEl) {
      const card = selectEl.closest('.question-card-item');
      const otherInput = card.querySelector('.select-other-input');
      if (otherInput) {
        if (selectEl.value === "other_option") {
          otherInput.style.display = "block";
          otherInput.required = true;
        } else {
          otherInput.style.display = "none";
          otherInput.value = "";
          otherInput.required = false;
        }
      }
    }

    function handleRadioOther(radioEl) {
      const card = radioEl.closest('.question-card-item');
      const radios = card.querySelectorAll('.dynamic-radio');
      radios.forEach(r => {
        const row = r.closest('div') || r.parentElement;
        const input = row.querySelector('.radio-other-input');
        if (input) {
          if (r.checked) {
            input.disabled = false;
            input.required = true;
          } else {
            input.disabled = true;
            input.value = "";
            input.required = false;
          }
        }
      });
    }

    function sendVerificationCode() {
      const email = document.getElementById("email").value.trim();
      const sendBtn = document.getElementById("sendCodeBtn");
      const msgDiv = document.getElementById("message");

      if (!validateSchoolEmail(email)) {
        alert("請輸入正確的學校信箱格式：7位學號@tshcmc.edu.vn（例如：1234567@tshcmc.edu.vn）！");
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = "發送中...";

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "sendCode", email: email })
      })
      .then(res => res.json())
      .then(res => {
        msgDiv.style.display = "block";
        if (res.status === "success") {
          msgDiv.className = "message success";
          msgDiv.textContent = res.message;
          document.getElementById("code").value = "";
          startCountdown(120);
        } else {
          msgDiv.className = "message error";
          msgDiv.textContent = res.message;
          sendBtn.disabled = false;
          sendBtn.textContent = "發送驗證碼";
        }
      })
      .catch(err => {
        alert("發送失敗，請稍後再試！");
        sendBtn.disabled = false;
        sendBtn.textContent = "發送驗證碼";
      });
    }

    function startCountdown(seconds) {
      const sendBtn = document.getElementById("sendCodeBtn");
      let remain = seconds;
      
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        if (remain <= 0) {
          clearInterval(countdownTimer);
          sendBtn.disabled = false;
          sendBtn.textContent = "發送驗證碼";
        } else {
          sendBtn.textContent = `${remain} 秒後重新發送`;
          remain--;
        }
      }, 1000);
    }

    document.getElementById("signupForm").addEventListener("submit", function(e) {
      e.preventDefault();

      if (currentEventData && currentEventData["結束時間"]) {
        const now = getNowGMT7();
        const endTime = new Date(currentEventData["結束時間"]);

        if (now >= endTime) {
          alert("⚠️ 很抱歉，該活動報名時間已截止！系統將自動為您跳轉回首頁。");
          window.location.href = "index.html";
          return;
        }
      }

      // 檢查多選題的選取數量限制
      let isValidSelection = true;
      const questionCards = document.querySelectorAll(".question-card-item");
      
      questionCards.forEach(card => {
        const type = card.getAttribute("data-type");
        if (type === "checkbox") {
          const label = card.getAttribute("data-label");
          const minSelect = parseInt(card.getAttribute("data-min") || 0);
          const maxSelect = parseInt(card.getAttribute("data-max") || 0);
          const checkedCount = card.querySelectorAll("input[type='checkbox']:checked").length;

          if (minSelect > 0 && maxSelect > 0 && minSelect === maxSelect) {
            if (checkedCount !== minSelect) {
              alert(`「${label}」須剛好選取 ${minSelect} 個選項！（目前選了 ${checkedCount} 個）`);
              isValidSelection = false;
              return;
            }
          } else {
            if (minSelect > 0 && checkedCount < minSelect) {
              alert(`「${label}」至少需選取 ${minSelect} 個選項！（目前選了 ${checkedCount} 個）`);
              isValidSelection = false;
              return;
            }
            if (maxSelect > 0 && checkedCount > maxSelect) {
              alert(`「${label}」最多只能選取 ${maxSelect} 個選項！（目前選了 ${checkedCount} 個）`);
              isValidSelection = false;
              return;
            }
          }
        }
      });

      if (!isValidSelection) return;

      const submitBtn = document.getElementById("submitBtn");
      const msgDiv = document.getElementById("message");

      const eventId = document.getElementById("eventId").value;
      const email = document.getElementById("email").value.trim();

      if (!eventId) {
        alert("無效的活動項目！");
        return;
      }

      if (!validateSchoolEmail(email)) {
        alert("信箱格式錯誤！必須為 7 位學號@tshcmc.edu.vn");
        return;
      }

      // 收集動態表單的答案
      let answers = {};

      questionCards.forEach(card => {
        const label = card.getAttribute("data-label");
        const type = card.getAttribute("data-type");

        if (type === "text" || type === "textarea") {
          const input = card.querySelector("input, textarea");
          if (input) answers[label] = input.value.trim();
        } else if (type === "select") {
          const select = card.querySelector("select");
          const otherInput = card.querySelector(".select-other-input");
          if (select.value === "other_option") {
            answers[label] = "其他：" + (otherInput ? otherInput.value.trim() : "");
          } else {
            answers[label] = select.value;
          }
        } else if (type === "radio") {
          const checkedRadio = card.querySelector("input[type='radio']:checked");
          if (checkedRadio) {
            if (checkedRadio.value === "other") {
              const otherInput = card.querySelector(".radio-other-input");
              answers[label] = "其他：" + (otherInput ? otherInput.value.trim() : "");
            } else {
              answers[label] = checkedRadio.value;
            }
          } else {
            answers[label] = "";
          }
        } else if (type === "checkbox") {
          const checkedBoxes = card.querySelectorAll("input[type='checkbox']:checked");
          let values = [];
          checkedBoxes.forEach(cb => {
            if (cb.value === "other") {
              const otherInput = cb.closest("div").querySelector(".checkbox-other-input");
              values.push("其他：" + (otherInput ? otherInput.value.trim() : ""));
            } else {
              values.push(cb.value);
            }
          });
          answers[label] = values;
        }
      });

      submitBtn.disabled = true;
      submitBtn.textContent = "資料提交中...";

      const payload = {
        action: "submit",
        eventId: eventId,
        email: email,
        code: document.getElementById("code").value.trim(),
        answers: answers
      };

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        msgDiv.style.display = "block";
        if (res.status === "success") {
          msgDiv.className = "message success";
          msgDiv.textContent = res.message + " 正在返回首頁...";
          document.getElementById("signupForm").reset();
          
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);
        } else {
          msgDiv.className = "message error";
          msgDiv.textContent = res.message;
          submitBtn.disabled = false;
          submitBtn.textContent = "確認並送出報名";
        }
      })
      .catch(err => {
        msgDiv.style.display = "block";
        msgDiv.className = "message error";
        msgDiv.textContent = "提交失敗，請檢查網路連線。";
        submitBtn.disabled = false;
        submitBtn.textContent = "確認並送出報名";
      });
    });

    // --- 🔒 嚴格指定監控特定試算表的狀態機制 ---
    let consecutiveErrors = 0;

    function checkSystemStatus(isInitialCheck = false) {
      fetch(`${GAS_URL}?action=checkLockStatus&spreadsheetId=${TARGET_SHEET_ID}&_t=${Date.now()}`)
        .then(res => res.json())
        .then(res => {
          if (res && res.status === "success") {
            if (res.maintenance === true) {
              if (isInitialCheck) {
                consecutiveErrors++;
                if (consecutiveErrors >= 3) {
                  window.location.href = "maintenance.html";
                } else {
                  setTimeout(() => checkSystemStatus(true), 500);
                }
              } else {
                window.location.href = "maintenance.html";
              }
              return;
            }

            if (res.locked === true) {
              if (isInitialCheck) {
                consecutiveErrors++;
                if (consecutiveErrors >= 3) {
                  window.location.href = "lock.html";
                } else {
                  setTimeout(() => checkSystemStatus(true), 500);
                }
              } else {
                window.location.href = "lock.html";
              }
              return;
            }

            consecutiveErrors = 0;
          }
        })
        .catch(err => {
          console.debug("背景狀態同步暫時略過 (網路波動)", err);
        });
    }

    window.addEventListener("load", () => {
      if (window.location.pathname.includes("lock.html") || window.location.pathname.includes("maintenance.html")) return;

      checkSystemStatus(true);
      setInterval(() => {
        checkSystemStatus(false);
      }, 2000);
    });
  </script>
</body>
</html>
