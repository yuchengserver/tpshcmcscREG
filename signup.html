<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSSC13TH - 活動報名專區</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 頂部導覽列 -->
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="tpshcmcsc.png" alt="TSSC Logo" class="nav-logo">
      <span>TSSC13TH 活動報名專區</span>
    </a>
    <div class="nav-menu">
      <a href="index.html" class="nav-btn active">首頁與通知</a>
    </div>
  </header>

  <div class="container signup-container">
    <p style="margin-bottom: 15px;"><a href="index.html" class="back-link">← 返回活動列表</a></p>

    <div class="event-detail-box">
      <h2 id="targetEventTitle" class="detail-title">載入活動名稱中...</h2>
      <p id="targetEventTime" class="detail-time">⏰ 時間：載入中...</p>
      <p id="targetEventDesc" class="detail-desc"></p>
    </div>

    <form id="signupForm" style="margin-top: 25px;">
      <div class="form-group" style="display:none;">
        <label for="eventId">選擇活動 *</label>
        <select id="eventId" class="form-control" required>
          <option value="">載入中...</option>
        </select>
      </div>

      <!-- 動態題目渲染容器 -->
      <div id="dynamicQuestionsContainer">
        <p style="color: #57606a;">正在載入報名表單題目...</p>
      </div>

      <div class="form-group" style="margin-top: 25px;">
        <label for="email">學校官方電子信箱 (@tshcmc.edu.vn) *</label>
        <div class="input-with-btn">
          <input type="email" id="email" class="form-control" required placeholder="s123456@tshcmc.edu.vn" pattern="^\d{7}@tshcmc\.edu\.vn$">
          <button type="button" id="sendCodeBtn" class="btn-verify" onclick="sendVerificationCode()">發送驗證碼</button>
        </div>
      </div>

      <div class="form-group">
        <label for="code">信箱驗證碼 (6 位數字) *</label>
        <input type="text" id="code" class="form-control" required placeholder="請輸入 6 位數驗證碼" maxlength="6">
        <small class="hint-text">請輸入寄送至您學校信箱中的 6 位數一次性驗證碼（有效期限 5 分鐘，每人每天最多發送 3 次）。</small>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit" style="margin-top: 20px;">確認並送出報名</button>
    </form>

    <div id="message" class="message" style="display:none;"></div>

    <div class="login-footer" style="margin-top: 35px; text-align: center;">
      胡志明市臺灣學校學生會 TSSC13TH © 2026 yucheng
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzw8vASm3Nm7eIpcQYQ_QBMK4m3j0d9Thcw8N8nWBsuUPJDCsioB_KLErcH1nIP2v0/exec";
    const TARGET_SHEET_ID = "18fxfF-BnNlDnhCH0NORbNeWXKSo1KHmljfPCkpvJTKo"; // 🔒 指定專用上鎖試算表 ID
    let countdownTimer = null;
    let currentEventData = null;

    function validateSchoolEmail(email) {
      const regex = /^\d{7}@tshcmc\.edu\.vn$/i;
      return regex.test(email);
    }

    function getNowGMT7() {
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      return new Date(utc + (3600000 * 7));
    }

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetEventId = urlParams.get('eventId');

      fetch(`${GAS_URL}?action=getEvents`)
        .then(res => res.json())
        .then(res => {
          const select = document.getElementById("eventId");
          select.innerHTML = '<option value="">-- 請選擇報名活動 --</option>';
          
          if (res.status === "success" && res.data && res.data.length > 0) {
            const now = getNowGMT7();

            res.data.forEach(item => {
              const startTime = new Date(item["開始時間"]);
              const endTime = new Date(item["結束時間"]);
              const isActive = (now >= startTime && now < endTime);
              
              if (isActive || item["活動ID"] === targetEventId) {
                const opt = document.createElement("option");
                opt.value = item["活動ID"];
                opt.textContent = `${item["活動名稱"]} (${item["活動ID"]})`;
                
                if (targetEventId && item["活動ID"] === targetEventId) {
                  opt.selected = true;
                  currentEventData = item;
                  document.getElementById("targetEventTitle").textContent = item["活動名稱"];
                  document.getElementById("targetEventDesc").textContent = item["說明"] || "";
                  document.getElementById("targetEventTime").textContent = `⏰ 開始時間：${new Date(item["開始時間"]).toLocaleString()} | ⌛ 截止時間：${new Date(item["結束時間"]).toLocaleString()}`;
                  
                  // 渲染動態表單題目
                  renderDynamicQuestions(item["題目JSON"]);
                }
                select.appendChild(opt);
              }
            });
          }
        });
    };

    function renderDynamicQuestions(jsonStr) {
      const container = document.getElementById("dynamicQuestionsContainer");
      container.innerHTML = "";

      try {
        const questions = JSON.parse(jsonStr || "[]");
        if (questions.length === 0) {
          container.innerHTML = "<p style='color: #cf222e;'>此活動尚未設定任何報名題目，請聯絡管理員。</p>";
          return;
        }

        questions.forEach((q, index) => {
          const div = document.createElement("div");
          div.className = "form-group";
          div.style.marginBottom = "20px";

          let labelHTML = `<label>${q.label} ${q.required ? '<span style="color:red;">*</span>' : ''}</label>`;
          let inputHTML = "";

          if (q.type === "text") {
            inputHTML = `<input type="text" class="form-control dynamic-input" data-label="${q.label}" ${q.required ? 'required' : ''} placeholder="請輸入${q.label}">`;
          } else if (q.type === "textarea") {
            inputHTML = `<textarea class="form-control dynamic-input" data-label="${q.label}" rows="3" ${q.required ? 'required' : ''} placeholder="請輸入${q.label}"></textarea>`;
          } else if (q.type === "select") {
            let opts = `<option value="">-- 請選擇 --</option>`;
            (q.options || []).forEach(opt => {
              opts += `<option value="${opt}">${opt}</option>`;
            });
            inputHTML = `<select class="form-control dynamic-input" data-label="${q.label}" ${q.required ? 'required' : ''}>${opts}</select>`;
          } else if (q.type === "radio") {
            let opts = "";
            (q.options || []).forEach(opt => {
              opts += `<div style="margin-top: 6px;"><label style="font-weight: normal; cursor: pointer;"><input type="radio" name="q_${index}" value="${opt}" class="dynamic-input" data-label="${q.label}" ${q.required ? 'required' : ''}> ${opt}</label></div>`;
            });
            inputHTML = opts;
          } else if (q.type === "checkbox") {
            let opts = "";
            (q.options || []).forEach(opt => {
              opts += `<div style="margin-top: 6px;"><label style="font-weight: normal; cursor: pointer;"><input type="checkbox" value="${opt}" class="dynamic-checkbox" data-label="${q.label}"> ${opt}</label></div>`;
            });
            inputHTML = opts;
          }

          div.innerHTML = labelHTML + inputHTML;
          container.appendChild(div);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = "<p style='color:red;'>題目載入解析失敗。</p>";
      }
    }

    function sendVerificationCode() {
      const email = document.getElementById("email").value.trim();
      const sendBtn = document.getElementById("sendCodeBtn");
      const msgDiv = document.getElementById("message");

      if (!validateSchoolEmail(email)) {
        alert("請輸入正確的學校信箱格式：7位學號@tshcmc.edu.vn（例如：1234567@tshcmc.edu.vn）！");
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = "發送中...";

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "sendCode", email: email })
      })
      .then(res => res.json())
      .then(res => {
        msgDiv.style.display = "block";
        if (res.status === "success") {
          msgDiv.className = "message success";
          msgDiv.textContent = res.message;
          startCountdown(120);
        } else {
          msgDiv.className = "message error";
          msgDiv.textContent = res.message;
          sendBtn.disabled = false;
          sendBtn.textContent = "發送驗證碼";
        }
      })
      .catch(err => {
        alert("發送失敗，請稍後再試！");
        sendBtn.disabled = false;
        sendBtn.textContent = "發送驗證碼";
      });
    }

    function startCountdown(seconds) {
      const sendBtn = document.getElementById("sendCodeBtn");
      let remain = seconds;
      
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        if (remain <= 0) {
          clearInterval(countdownTimer);
          sendBtn.disabled = false;
          sendBtn.textContent = "發送驗證碼";
        } else {
          sendBtn.textContent = `${remain} 秒後重新發送`;
          remain--;
        }
      }, 1000);
    }

    document.getElementById("signupForm").addEventListener("submit", function(e) {
      e.preventDefault();

      if (currentEventData && currentEventData["結束時間"]) {
        const now = getNowGMT7();
        const endTime = new Date(currentEventData["結束時間"]);

        if (now >= endTime) {
          alert("⚠️ 很抱歉，該活動報名時間已截止！系統將自動為您跳轉回首頁。");
          window.location.href = "index.html";
          return;
        }
      }

      const submitBtn = document.getElementById("submitBtn");
      const msgDiv = document.getElementById("message");

      const eventId = document.getElementById("eventId").value;
      const email = document.getElementById("email").value.trim();

      if (!eventId) {
        alert("無效的活動項目！");
        return;
      }

      if (!validateSchoolEmail(email)) {
        alert("信箱格式錯誤！必須為 7 位學號@tshcmc.edu.vn");
        return;
      }

      // 收集動態表單的答案
      let answers = {};
      
      // 1. 收集普通文字、長文字、下拉與單選
      const inputs = document.querySelectorAll(".dynamic-input");
      inputs.forEach(el => {
        const label = el.getAttribute("data-label");
        if (el.type === "radio") {
          if (el.checked) answers[label] = el.value;
        } else {
          answers[label] = el.value.trim();
        }
      });

      // 2. 收集核取方塊 (多選)
      const checkboxes = document.querySelectorAll(".dynamic-checkbox");
      let cbMap = {};
      checkboxes.forEach(el => {
        const label = el.getAttribute("data-label");
        if (!cbMap[label]) cbMap[label] = [];
        if (el.checked) {
          cbMap[label].push(el.value);
        }
      });
      for (let label in cbMap) {
        answers[label] = cbMap[label];
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "資料提交中...";

      const payload = {
        action: "submit",
        eventId: eventId,
        email: email,
        code: document.getElementById("code").value.trim(),
        answers: answers
      };

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        msgDiv.style.display = "block";
        if (res.status === "success") {
          msgDiv.className = "message success";
          msgDiv.textContent = res.message + " 正在返回首頁...";
          document.getElementById("signupForm").reset();
          
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);
        } else {
          msgDiv.className = "message error";
          msgDiv.textContent = res.message;
          submitBtn.disabled = false;
          submitBtn.textContent = "確認並送出報名";
        }
      })
      .catch(err => {
        msgDiv.style.display = "block";
        msgDiv.className = "message error";
        msgDiv.textContent = "提交失敗，請檢查網路連線。";
        submitBtn.disabled = false;
        submitBtn.textContent = "確認並送出報名";
      });
    });

    // --- 🔒 嚴格指定監控特定試算表的狀態機制 ---
    let consecutiveErrors = 0;

    function checkSystemStatus(isInitialCheck = false) {
      fetch(`${GAS_URL}?action=checkLockStatus&spreadsheetId=${TARGET_SHEET_ID}&_t=${Date.now()}`)
        .then(res => res.json())
        .then(res => {
          if (res && res.status === "success") {
            if (res.maintenance === true) {
              if (isInitialCheck) {
                consecutiveErrors++;
                if (consecutiveErrors >= 3) {
                  window.location.href = "maintenance.html";
                } else {
                  setTimeout(() => checkSystemStatus(true), 500);
                }
              } else {
                window.location.href = "maintenance.html";
              }
              return;
            }

            if (res.locked === true) {
              if (isInitialCheck) {
                consecutiveErrors++;
                if (consecutiveErrors >= 3) {
                  window.location.href = "lock.html";
                } else {
                  setTimeout(() => checkSystemStatus(true), 500);
                }
              } else {
                window.location.href = "lock.html";
              }
              return;
            }

            consecutiveErrors = 0;
          }
        })
        .catch(err => {
          console.debug("背景狀態同步暫時略過 (網路波動)", err);
        });
    }

    window.addEventListener("load", () => {
      if (window.location.pathname.includes("lock.html") || window.location.pathname.includes("maintenance.html")) return;

      checkSystemStatus(true);
      setInterval(() => {
        checkSystemStatus(false);
      }, 2000);
    });
  </script>
</body>
</html>
