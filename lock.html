<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統通知 - 鎖定頁面</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .lock-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        
        /* 🔴 閃爍紅光的呼吸燈動畫 */
        @keyframes redGlowBreathing {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 22px 6px rgba(239, 68, 68, 0.85);
                transform: scale(1.05);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
                transform: scale(1);
            }
        } 

        .icon-container {
            width: 75px;
            height: 75px;
            background-color: #fef2f2; /* 淡紅色背景襯托警告 icon */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
            font-size: 2.2rem;
            animation: redGlowBreathing 1.2s infinite ease-in-out; /* 閃爍紅光 */
        }

        .title {
            font-size: 1.25rem;
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .main-message {
            font-size: 1.15rem;
            color: #0f172a;
            font-weight: 800;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .sub-message {
            font-size: 1rem;
            color: #334155;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .contact-info {
            color: #64748b;
            font-size: 0.92rem;
            margin-bottom: 30px;
        }

        .divider {
            height: 1px;
            background-color: #f1f5f9;
            margin: 20px 0;
        }

        .org-title {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .badge-locked {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #fef2f2;
            color: #ef4444;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .lock-card {
                padding: 30px 20px;
            }
            .main-message {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <div class="lock-card">
        <!-- 黃色警告圖示 + 外圍閃爍紅光 -->
        <div class="icon-container">
            ⚠️
        </div>

        <!-- 標題與內文 -->
        <div class="title">系統通知</div>
        <div class="main-message">系統已停止傳輸，服務將全面關閉</div>
        <div class="sub-message">詳情請洽 TSSC13TH學生會</div>

        <div class="contact-info">
            詳情請洽 TSSC13TH 學生會
        </div>

        <div class="divider"></div>

        <!-- 組織署名與鎖定標籤 -->
        <div class="org-title">
            胡志明市台灣學校學生會 TSSC13TH
        </div>

        <div class="badge-locked">
            🔒 系統目前已全面鎖定
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzw8vASm3Nm7eIpcQYQ_QBMK4m3j0d9Thcw8N8nWBsuUPJDCsioB_KLErcH1nIP2v0/exec';

        // 🔓 嚴格檢查解鎖狀態
        function checkUnlockStatus() {
            fetch(`${GAS_URL}?action=checkLockStatus&_t=${Date.now()}`)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP 錯誤');
                    return res.json();
                })
                .then(data => {
                    // 只要後端回傳 status 為 success 且 locked明確等於 false，立即自動跳轉回首頁！
                    if (data && data.status === "success" && data.locked === false) {
                        window.location.href = 'index.html';
                    }
                })
                .catch(err => console.debug('背景解除鎖定檢測中...', err));
        }

        // 頁面載入時執行，每 3 秒輪詢一次，當試算表改回 false 時自動解鎖跳轉
        window.onload = function() {
            checkUnlockStatus();
            setInterval(checkUnlockStatus, 3000);
        };
    </script>
</body>
</html>
