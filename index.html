<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= HtmlService.createHtmlOutputFromFile('style').getContent(); ?>
  <style>
    /* 頂部管理員連結按鈕 */
    .admin-link {
      text-align: right;
      margin-bottom: 10px;
    }
    .admin-link a {
      color: var(--primary-color);
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: bold;
    }
    .admin-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 管理員快速入口 -->
    <div class="admin-link">
      <a href="<?= ScriptApp.getService().getUrl(); ?>?page=admins">⚙️ 管理員登入</a>
    </div>

    <div class="header">
      <img src="tpshcmcsc.png" alt="會徽" onerror="this.style.display='none'">
      <h1>TSSC13TH 活動列表</h1>
    </div>

    <!-- 頁籤分類 -->
    <div class="tabs">
      <button class="tab-btn active" data-status="active" onclick="filterEvents('active', this)">報名進行中</button>
      <button class="tab-btn" data-status="upcoming" onclick="filterEvents('upcoming', this)">待開始</button>
      <button class="tab-btn" data-status="ended" onclick="filterEvents('ended', this)">已截止</button>
    </div>

    <div id="loading" style="text-align: center; color: #6c757d; padding: 20px;">載入活動資料中...</div>
    <div id="eventList"></div>
  </div>

  <script>
    let allEvents = [];
    // 使用 GAS 樣板語法動態取得目前 Web App 的部署網址
    const baseURL = "<?= ScriptApp.getService().getUrl(); ?>";

    window.onload = function() {
      google.script.run
        .withSuccessHandler(function(events) {
          allEvents = events || [];
          document.getElementById('loading').style.display = 'none';
          // 初始載入預設顯示「報名進行中」
          const defaultBtn = document.querySelector('.tab-btn[data-status="active"]');
          filterEvents('active', defaultBtn);
        })
        .withFailureHandler(function(err) {
          document.getElementById('loading').innerText = '載入活動失敗，請重新整理頁面。';
        })
        .getEvents();
    };

    function filterEvents(status, targetBtn) {
      // 切換 Tab 樣式
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      
      if (targetBtn) {
        targetBtn.classList.add('active');
      } else {
        const activeBtn = document.querySelector(`.tab-btn[data-status="${status}"]`);
        if (activeBtn) activeBtn.classList.add('active');
      }

      const container = document.getElementById('eventList');
      const filtered = allEvents.filter(evt => evt.status === status);

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#adb5bd; padding:30px; font-size:0.95rem;">📭 目前尚無相關活動</div>';
        return;
      }

      container.innerHTML = filtered.map(evt => {
        let btnHtml = '';
        let badgeHtml = '';

        if (evt.status === 'active') {
          badgeHtml = '<span class="badge active">報名中</span>';
          btnHtml = `<a href="${baseURL}?page=signup&eventId=${encodeURIComponent(evt.id)}" class="btn-action active">立即報名</a>`;
        } else if (evt.status === 'upcoming') {
          badgeHtml = '<span class="badge upcoming">待開始</span>';
          btnHtml = `<button class="btn-action disabled" disabled>尚未開放</button>`;
        } else {
          badgeHtml = '<span class="badge ended">已截止</span>';
          btnHtml = `<button class="btn-action disabled" disabled>報名已結束</button>`;
        }

        return `
          <div class="event-card">
            <div class="event-title">
              <span>${escapeHtml(evt.title)}</span>
              ${badgeHtml}
            </div>
            <div class="event-desc">${escapeHtml(evt.description)}</div>
            <div class="event-time">⏱️ 報名時間：${evt.startTime} ~ ${evt.endTime}</div>
            ${btnHtml}
          </div>
        `;
      }).join('');
    }

    // 防範 XSS 攻擊的基本 HTML 轉義函式 (強化型)
    function escapeHtml(text) {
      if (text === null || text === undefined) return '';
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
