<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統通知 - TSSC13TH 胡台校活動報名專區</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        /* 警告 Icon 區塊 (保持穩定，不閃爍) */
        .icon-box {
            width: 68px;
            height: 68px;
            background-color: #fef3c7;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 2rem;
        }

        .title {
            font-size: 1.15rem;
            color: #334155;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .main-message {
            font-size: 1.35rem;
            color: #0f172a;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .sub-message {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .time-text {
            font-size: 0.9rem;
            color: #d97706;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .footer-org {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #fef3c7;
            color: #b45309;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 圖示 (黃色警告) -->
        <div class="icon-box">
            ⚠️
        </div>

        <!-- 文字層級 -->
        <div class="title">系統通知</div>

        <div class="main-message">
            系統正在維護更新中
        </div>

        <div class="sub-message">
            維護期間將暫時停止活動報名等功能，造成不便，敬請見諒
        </div>

        <!-- 預計恢復時間顯示（B3 有填寫時自動顯示） -->
        <div id="timeBox" class="time-text" style="display: none;">
            預計恢復使用時間：<span id="maintenanceTimeText"></span>
        </div>

        <div class="footer-org">
            胡志明市台灣學校學生會 TSSC13TH
        </div>

        <!-- 底部狀態標籤 -->
        <div>
            <div class="badge-status">
                🛠️ 系統目前處於維護狀態
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzw8vASm3Nm7eIpcQYQ_QBMK4m3j0d9Thcw8N8nWBsuUPJDCsioB_KLErcH1nIP2v0/exec';

        function checkMaintenanceStatus() {
            fetch(`${GAS_URL}?action=checkLockStatus&_t=${Date.now()}`)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP 錯誤');
                    return res.json();
                })
                .then(data => {
                    if (data && data.status === "success") {
                        // 1. 動態更新 B3 預計恢復時間顯示
                        const timeBox = document.getElementById('timeBox');
                        const timeText = document.getElementById('maintenanceTimeText');
                        if (data.maintenanceTime && data.maintenanceTime.trim() !== "") {
                            timeText.innerText = data.maintenanceTime;
                            timeBox.style.display = 'block';
                        } else {
                            timeBox.style.display = 'none';
                        }

                        // 2. 只有當維護模式與完全上鎖都變成 false 時，才跳回首頁，避免來回閃爍
                        if (data.locked === false && data.maintenance === false) {
                            window.location.href = 'index.html';
                        }
                    }
                })
                .catch(err => console.debug('維護狀態檢測中...', err));
        }

        // 頁面載入時執行，並設置 2 秒定期檢測
        window.onload = function() {
            checkMaintenanceStatus();
            setInterval(checkMaintenanceStatus, 2000);
        };
    </script>
</body>
</html>
