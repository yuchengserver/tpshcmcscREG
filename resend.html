<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSSC13TH - 查詢我的報名紀錄</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="tpshcmcsc.png" alt="TSSC Logo" class="nav-logo">
      <span>TSSC13TH 活動報名專區</span>
    </a>
    <div class="nav-menu">
      <a href="index.html" class="nav-btn">首頁與通知</a>
      <a href="resend.html" class="nav-btn active">🔍 查詢我的報名</a>
    </div>
  </header>

  <div class="container wide">
    <p style="margin-bottom: 15px;"><a href="index.html" class="back-link">← 返回活動列表</a></p>

    <!-- 驗證區塊 (預設顯示) -->
    <div id="authSection">
      <div class="rule-card">
        <h3>🔍 查詢與管理我的報名紀錄</h3>
        <p style="margin-top: 8px; color: #57606a;">請輸入您的學校信箱並取得驗證碼，即可查看您所有報名過的活動。若活動仍在開放報名時間內，您可以選擇直接取消報名或重新報名。</p>
      </div>

      <div class="login-card" style="max-width: 600px; margin: 30px auto; padding: 25px;">
        <div class="form-group">
          <label for="email">學校官方電子信箱 (@tshcmc.edu.vn) *</label>
          <div class="input-with-btn">
            <input type="email" id="email" class="form-control" required placeholder="1234567@tshcmc.edu.vn">
            <button type="button" id="sendCodeBtn" class="btn-verify" onclick="sendVerificationCode()">發送驗證碼</button>
          </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
          <label for="code">信箱驗證碼 (6 位數字) *</label>
          <input type="text" id="code" class="form-control" required placeholder="請輸入 6 位數驗證碼" maxlength="6">
        </div>

        <button type="button" class="btn-submit" onclick="fetchMyRegistrations()" style="margin-top: 20px;">立即查詢紀錄</button>
        <div id="message" class="message" style="display:none; margin-top: 15px;"></div>
      </div>
    </div>

    <div id="resultsContainer" style="display: none; margin-top: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #eaecef; padding-bottom: 10px;">
        <h3 style="margin: 0;">📋 您的報名紀錄清單</h3>
        <button type="button" onclick="resetToAuth()" class="btn-secondary" style="width: auto; padding: 6px 14px; background-color: #f6f8fa; border: 1px solid #d0d7de; cursor: pointer; border-radius: 6px; font-size: 13px;">🔒 登出 / 重新驗證</button>
      </div>
      <p id="userEmailDisplay" style="color: #57606a; font-size: 14px; margin-bottom: 20px;"></p>
      <div id="recordsGrid" class="event-grid"></div>
    </div>

    <div class="login-footer" style="margin-top: 40px; text-align: center;">
      胡志明市臺灣學校學生會 TSSC13TH © 2026 yucheng
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzw8vASm3Nm7eIpcQYQ_QBMK4m3j0d9Thcw8N8nWBsuUPJDCsioB_KLErcH1nIP2v0/exec";
    const TARGET_SHEET_ID = "18fxfF-BnNlDnhCH0NORbNeWXKSo1KHmljfPCkpvJTKo";
    let countdownTimer = null;
    let allEventsMap = {};
    let activeEmail = "";
    let activeCode = "";

    function validateSchoolEmail(email) {
      const regex = /^\d{7}@tshcmc\.edu\.vn$/i;
      return regex.test(email);
    }

    function sendVerificationCode() {
      const email = document.getElementById("email").value.trim();
      const sendBtn = document.getElementById("sendCodeBtn");
      const msgDiv = document.getElementById("message");

      if (!validateSchoolEmail(email)) {
        alert("請輸入正確的學校信箱格式：7位學號@tshcmc.edu.vn！");
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = "發送中...";

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "sendCode", email: email })
      })
      .then(res => res.json())
      .then(res => {
        msgDiv.style.display = "block";
        if (res.status === "success") {
          msgDiv.className = "message success";
          msgDiv.textContent = res.message;
          document.getElementById("code").value = "";
          startCountdown(120);
        } else {
          msgDiv.className = "message error";
          msgDiv.textContent = res.message;
          sendBtn.disabled = false;
          sendBtn.textContent = "發送驗證碼";
        }
      })
      .catch(err => {
        alert("發送失敗，請稍後再試！");
        sendBtn.disabled = false;
        sendBtn.textContent = "發送驗證碼";
      });
    }

    function startCountdown(seconds) {
      const sendBtn = document.getElementById("sendCodeBtn");
      let remain = seconds;
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        if (remain <= 0) {
          clearInterval(countdownTimer);
          sendBtn.disabled = false;
          sendBtn.textContent = "發送驗證碼";
        } else {
          sendBtn.textContent = `${remain} 秒後重新發送`;
          remain--;
        }
      }, 1000);
    }

    function loadAllEvents() {
      return fetch(`${GAS_URL}?action=getEvents`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success" && res.data) {
            res.data.forEach(ev => {
              allEventsMap[ev["活動ID"]] = ev;
            });
          }
        });
    }

    async function fetchMyRegistrations() {
      const email = document.getElementById("email").value.trim();
      const code = document.getElementById("code").value.trim();
      const msgDiv = document.getElementById("message");
      const authSection = document.getElementById("authSection");
      const resultsContainer = document.getElementById("resultsContainer");
      const recordsGrid = document.getElementById("recordsGrid");
      const userEmailDisplay = document.getElementById("userEmailDisplay");

      if (!validateSchoolEmail(email) || !code) {
        msgDiv.style.display = "block";
        msgDiv.className = "message error";
        msgDiv.textContent = "請完整輸入學校信箱與 6 位數驗證碼！";
        return;
      }

      msgDiv.style.display = "block";
      msgDiv.className = "message";
      msgDiv.textContent = "正在驗證並查詢您的報名紀錄...";

      await loadAllEvents();

      fetch(`${GAS_URL}?action=getMyRegistrations&email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
        
            activeEmail = email;
            activeCode = code;

            authSection.style.display = "none";
            resultsContainer.style.display = "block";
            userEmailDisplay.textContent = `目前登入查詢信箱：${email}`;
            recordsGrid.innerHTML = "";

            const records = res.data;
            if (records.length === 0) {
              recordsGrid.innerHTML = "<p class='no-data'>查無您的報名紀錄。</p>";
              return;
            }

            const now = new Date();

            records.forEach(rec => {
              const eventId = rec["活動ID"];
              const eventInfo = allEventsMap[eventId] || {};
              const eventName = eventInfo["活動名稱"] || eventId;
              const startTime = eventInfo["開始時間"] ? new Date(eventInfo["開始時間"]) : null;
              const endTime = eventInfo["結束時間"] ? new Date(eventInfo["結束時間"]) : null;

              const isOpen = (startTime && endTime && now >= startTime && now < endTime);

              let detailsHTML = "";
              for (let key in rec) {
                if (key !== "報名時間" && key !== "活動ID" && key !== "email") {
                  detailsHTML += `<li><strong>${key}：</strong>${rec[key]}</li>`;
                }
              }

              let actionHTML = "";
              if (isOpen) {
                actionHTML = `
                  <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <a href="signup.html?eventId=${encodeURIComponent(eventId)}" class="btn-card-action btn-card-active" style="flex:1; text-align:center;">🔄 重新報名 / 修改</a>
                    <button onclick="cancelReg('${email}', '${eventId}', '${code}')" class="btn-card-action" style="flex:1; background-color: #ffeef0; color: #cf222e; border: 1px solid #ffc1c0; cursor:pointer; border-radius:6px; font-weight:600;">❌ 取消報名</button>
                  </div>
                `;
              } else {
                actionHTML = `<p style="margin-top: 15px; color: #57606a; font-size: 13px;">🔒 該活動已截止或尚未開放，目前僅能檢視報名資料。</p>`;
              }

              const card = document.createElement("div");
              card.className = "event-card";
              card.innerHTML = `
                <div class="card-body">
                  <h3 class="card-title">${eventName}</h3>
                  <p class="card-desc"><strong>報名時間：</strong>${new Date(rec["報名時間"]).toLocaleString()}</p>
                  <ul style="list-style: none; padding: 0; margin-top: 10px; font-size: 14px; color: #24292f;">
                    ${detailsHTML}
                  </ul>
                </div>
                <div class="card-footer" style="display: block; padding: 15px;">
                  ${actionHTML}
                </div>
              `;
              recordsGrid.appendChild(card);
            });

          } else {
            msgDiv.style.display = "block";
            msgDiv.className = "message error";
            msgDiv.textContent = res.message;
          }
        })
        .catch(err => {
          msgDiv.style.display = "block";
          msgDiv.className = "message error";
          msgDiv.textContent = "查詢失敗，請檢查網路連線。";
        });
    }

    function cancelReg(email, eventId, code) {
      if (!confirm("確定要取消此活動的報名嗎？")) return;

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "cancelRegistration", email, eventId, code })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        if (res.status === "success") {
          // 重新整理查詢結果
          fetchMyRegistrations();
        }
      })
      .catch(err => {
        alert("操作失敗，請稍後再試。");
      });
    }

    function resetToAuth() {
      activeEmail = "";
      activeCode = "";
      document.getElementById("email").value = "";
      document.getElementById("code").value = "";
      document.getElementById("message").style.display = "none";
      
      document.getElementById("resultsContainer").style.display = "none";
      document.getElementById("authSection").style.display = "block";
    }

    window.addEventListener("beforeunload", () => {
      resetToAuth();
    });

    let consecutiveErrors = 0;
    function checkSystemStatus(isInitialCheck = false) {
      fetch(`${GAS_URL}?action=checkLockStatus&spreadsheetId=${TARGET_SHEET_ID}&_t=${Date.now()}`)
        .then(res => res.json())
        .then(res => {
          if (res && res.status === "success") {
            if (res.maintenance === true) {
              window.location.href = "maintenance.html";
              return;
            }
            if (res.locked === true) {
              window.location.href = "lock.html";
              return;
            }
          }
        });
    }

    window.addEventListener("load", () => {
      checkSystemStatus(true);
      setInterval(() => checkSystemStatus(false), 2000);
    });
  </script>
</body>
</html>
